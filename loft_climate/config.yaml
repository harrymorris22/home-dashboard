name: Loft Climate Dashboard
version: "0.18.0"
slug: loft_climate
description: Smart climate control for a SW-facing London loft. Recommends per-zone blind positions and window open/closed states based on indoor sensors, weather, sun position, and a configurable rule engine.
arch:
  - aarch64
  - amd64
url: https://github.com/harrymorris22/home-dashboard
init: false
boot: auto
startup: services
host_network: true
ports:
  "8000/tcp": 8000
ports_description:
  "8000/tcp": Dashboard web UI + API
hassio_api: true
homeassistant_api: false
auth_api: false
map:
  - addon_config:rw
options:
  weather_provider: "met_no"
  weather_user_agent: "loft-climate (your-email@example.com)"
  owm_api_key: ""
  ha_token: ""
  ha_entity_map: {}
  ha_outdoor_entities: {}
  ha_sunshine_entity: ""
  ha_blind_entities: {}
  vapid_subject: "mailto:harrymorris22@gmail.com"
  notify_email_smtp_password: ""
  notify_email_to: ""
  data_retention_days: 90
  log_level: info
schema:
  weather_provider: "list(met_no|owm)?"
  weather_user_agent: str?
  owm_api_key: str?
  ha_token: str?
  ha_entity_map: "match(^(\\{.*\\}|)$)?"
  ha_outdoor_entities: "match(^(\\{.*\\}|)$)?"
  ha_sunshine_entity: str?
  ha_blind_entities: "match(^(\\{.*\\}|)$)?"
  vapid_subject: str?
  notify_email_smtp_password: str?
  notify_email_to: str?
  data_retention_days: "int(7,3650)?"
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
